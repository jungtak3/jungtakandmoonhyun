<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>JT ♥ MH — Coming Soon</title>
<!-- ponytail: placeholder page. Real invitation replaces this when the details arrive. -->
<style>
  :root{ --cream:#fdfaf6; --plum:#3a2630; --rose:#b07c88; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--cream);color:var(--plum);
       font-family:"Nanum Myeongjo","Noto Serif KR",Georgia,serif;
       -webkit-font-smoothing:antialiased;
       display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.9}
  .box{padding:32px 24px;max-width:420px}
  .eyebrow{letter-spacing:.44em;font-size:10px;color:var(--rose);text-transform:uppercase;margin:0 0 34px}
  .mono{font-size:34px;letter-spacing:.14em;margin:0;font-weight:400}
  .mono .amp{color:var(--rose);font-size:21px;vertical-align:middle;margin:0 9px}
  .heart{display:inline-block;animation:beat 2.6s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.15)}24%{transform:scale(1)}36%{transform:scale(1.09)}48%{transform:scale(1)}}
  .rule{width:34px;height:1px;background:var(--rose);opacity:.65;margin:30px auto}
  .badge{display:inline-block;padding:7px 18px;border:1px solid var(--rose);border-radius:999px;
         font-size:11.5px;letter-spacing:.26em;color:var(--rose);margin:0 0 22px}
  .msg{font-size:14px;color:#5c4a53;margin:0;white-space:pre-line}
  .date{margin:30px 0 0;font-size:11.5px;letter-spacing:.32em;color:#a2939a}
</style>
</head>
<body>
  <div class="box">
    <p class="eyebrow">Our Wedding</p>

    <p class="mono">JT<span class="amp heart">♥</span>MH</p>

    <div class="rule"></div>

    <p class="badge">COMING SOON</p>

    <p class="msg">청첩장을 예쁘게 준비하고 있어요.
조금만 기다려 주세요 <span class="heart" style="font-size:11px">♥</span></p>

    <p class="date">2027 . 03</p>
  </div>
</body>
</html>
