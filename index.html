<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>정탁 · 문현 결혼합니다</title>
<!-- ponytail: single file, no build step. Fill the TODO lines and push. -->
<style>
  :root{ --cream:#fdfaf6; --plum:#3a2630; --rose:#b07c88; --ink:#2c2129; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
       font-family:"Nanum Myeongjo","Noto Serif KR",Georgia,serif;
       -webkit-font-smoothing:antialiased;line-height:1.85}
  .wrap{max-width:520px;margin:0 auto;padding:56px 24px 72px;text-align:center}
  .eyebrow{letter-spacing:.42em;font-size:11px;color:var(--rose);text-transform:uppercase;margin-bottom:28px}
  h1{font-size:26px;font-weight:400;margin:0 0 6px;letter-spacing:.06em}
  h1 span{color:var(--rose);font-size:20px;vertical-align:middle;margin:0 8px}
  .date{margin-top:18px;font-size:14px;letter-spacing:.24em;color:#6b5a62}
  .rule{width:38px;height:1px;background:var(--rose);margin:34px auto;opacity:.7}
  .greet{font-size:14.5px;color:#4c3d45;white-space:pre-line}
  .card{margin-top:38px;padding:26px 20px;border:1px solid #ece0de;border-radius:2px;background:#fffdfa}
  .card h2{font-size:12px;letter-spacing:.34em;color:var(--rose);font-weight:400;margin:0 0 14px}
  .venue{font-size:16px;margin-bottom:4px}
  .addr{font-size:13px;color:#6b5a62}
  .btn{display:inline-block;margin-top:16px;padding:9px 20px;border:1px solid var(--rose);
       color:var(--plum);text-decoration:none;font-size:12.5px;letter-spacing:.16em;border-radius:2px}
  .qr{margin:44px auto 0;width:190px}
  .qr img{width:100%;height:auto;display:block}
  .qr p{font-size:11px;letter-spacing:.24em;color:var(--rose);margin-top:12px}
  footer{margin-top:52px;font-size:11px;color:#a2939a;letter-spacing:.2em}
</style>
</head>
<body>
<div class="wrap">

  <p class="eyebrow">Wedding Invitation</p>

  <h1>정탁 <span>♥</span> 문현</h1>
  <!-- TODO: 실제 한글 이름으로 교체 -->
  <p class="date">2027. 03. 00 &nbsp;SAT &nbsp;PM 12:00</p>
  <!-- TODO: 실제 일시 -->

  <div class="rule"></div>

  <p class="greet">저희 두 사람이 결혼합니다.
서로의 계절을 함께 걷겠다는 약속을
여러분 앞에서 나누고자 합니다.

오셔서 축복해 주시면 감사하겠습니다.</p>
  <!-- TODO: 인사말 문구 -->

  <div class="card">
    <h2>오시는 길</h2>
    <p class="venue">예식장 이름</p>
    <!-- TODO: 예식장 -->
    <p class="addr">서울특별시 00구 00로 00</p>
    <!-- TODO: 주소 -->
    <a class="btn" href="https://map.kakao.com/?q=예식장" target="_blank" rel="noopener">카카오맵으로 보기</a>
  </div>

  <div class="qr">
    <img src="assets/qr_heart.png" alt="청첩장 QR 코드">
    <p>SCAN TO SHARE</p>
  </div>

  <footer>JUNGTAK &amp; MOONHYUN</footer>
</div>
</body>
</html>
